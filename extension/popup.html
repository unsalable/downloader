<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Universal Downloader Connector</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <!-- The application's six-blade aperture, halved from the 48-unit box
           src/components/layout/Logo.tsx draws it in. One shape in three
           places: change it here, there and in scripts/generate_icon.py. -->
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <mask id="popupMarkMask">
            <rect width="24" height="24" fill="black" />
            <circle cx="12" cy="12" r="10" fill="white" />
            <path d="M12 5.3 17.8 8.65 17.8 15.35 12 18.7 6.2 15.35 6.2 8.65Z" fill="black" />
            <g stroke="black" stroke-width="1.7" stroke-linecap="round">
              <path d="M12 5.3 25 12.8" />
              <path d="M17.8 8.65 17.8 23.65" />
              <path d="M17.8 15.35 4.8 22.85" />
              <path d="M12 18.7 -1 11.2" />
              <path d="M6.2 15.35 6.2 0.35" />
              <path d="M6.2 8.65 19.2 1.15" />
            </g>
          </mask>
        </defs>
        <circle cx="12" cy="12" r="10" fill="currentColor" mask="url(#popupMarkMask)" />
      </svg>
      <span class="name" data-i18n="extName"></span>
      <span class="dot" id="dot" data-tone="idle"></span>
    </header>

    <main class="panel enter" id="panel" aria-live="polite">
      <h1 class="title" id="title" data-i18n="statusChecking"></h1>
      <p class="body" id="body"></p>

      <!-- The confirmation stands in for the action row rather than arriving
           under it, so the question appears where the button that asked it
           was. -->
      <div class="actions" id="actions">
        <button id="btnConnect" data-i18n="btnConnect" hidden></button>
        <button id="btnOpenApp" data-i18n="btnOpenApp" hidden></button>
        <button id="btnRetry" data-i18n="btnRetry" hidden></button>
        <button id="btnForget" class="quiet" data-i18n="btnForget" hidden></button>
      </div>

      <div class="confirm" id="confirm" hidden>
        <p class="ask" data-i18n="forgetTitle"></p>
        <div class="actions">
          <button id="btnForgetYes" class="primary" data-i18n="btnForget"></button>
          <button id="btnForgetNo" class="quiet" data-i18n="btnCancel"></button>
        </div>
      </div>
    </main>

    <section class="fold" id="help" hidden>
      <button class="fold-head" id="helpHead" type="button" aria-expanded="false" aria-controls="helpBody">
        <span data-i18n="moreTitle"></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="fold-wrap" id="helpBody">
        <div class="fold-body">
          <div class="grant" id="grantGoogle">
            <h3 data-i18n="grantGoogleTitle"></h3>
            <p data-i18n="grantGoogleBody"></p>
            <button id="btnGrantGoogle" data-i18n="btnGrantGoogle"></button>
            <p class="granted" data-i18n="grantGoogleDone" hidden></p>
          </div>

          <div class="grant" id="grantAccount">
            <h3 data-i18n="grantAccountTitle"></h3>
            <p data-i18n="grantAccountBody"></p>
            <button id="btnGrantAccount" data-i18n="btnGrantAccount"></button>
            <p class="granted" data-i18n="grantAccountDone" hidden></p>
          </div>
        </div>
      </div>
    </section>

    <section class="fold" id="details">
      <button class="fold-head" id="detailsHead" type="button" aria-expanded="false" aria-controls="detailsBody">
        <span data-i18n="detailsTitle"></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="fold-wrap" id="detailsBody">
        <div class="fold-body">
          <dl class="facts">
            <div class="fact" id="factAccount" hidden>
              <dt data-i18n="labelAccount"></dt>
              <dd id="valueAccount"></dd>
            </div>
            <div class="fact" id="factSent" hidden>
              <dt data-i18n="labelLastSent"></dt>
              <dd id="valueSent"></dd>
            </div>
            <div class="fact" id="factAppVersion" hidden>
              <dt data-i18n="labelAppVersion"></dt>
              <dd id="valueAppVersion"></dd>
            </div>
            <div class="fact" id="factExtVersion">
              <dt data-i18n="labelExtensionVersion"></dt>
              <dd id="valueExtVersion"></dd>
            </div>
            <div class="fact fact-path" id="factPath" hidden>
              <dt data-i18n="labelApp"></dt>
              <dd><code id="valuePath"></code></dd>
            </div>
          </dl>
          <p class="hint" id="pathHint" data-i18n="labelAppHint" hidden></p>
        </div>
      </div>
    </section>

    <footer class="pin" id="pin" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4.75 6H7v-.5a2.5 2.5 0 0 1 5 0V6h2.25A1.25 1.25 0 0 1 15.5 7.25V9.5h.5a2.5 2.5 0 0 1 0 5h-.5v2.25A1.25 1.25 0 0 1 14.25 18H4.75A1.25 1.25 0 0 1 3.5 16.75V7.25A1.25 1.25 0 0 1 4.75 6Z"
          fill="currentColor"
        />
      </svg>
      <div>
        <strong data-i18n="pinTitle"></strong>
        <p data-i18n="pinBody"></p>
      </div>
    </footer>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
