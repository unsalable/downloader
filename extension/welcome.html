<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Downloader Connector</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <main>
      <header>
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linejoin="round"
          />
        </svg>
        <h1 data-i18n="welcomeTitle"></h1>
        <p class="lead" data-i18n="welcomeLead"></p>
      </header>

      <ol class="steps">
        <li>
          <h2 data-i18n="step1Title"></h2>
          <p data-i18n="step1Body"></p>
        </li>
        <li>
          <h2 data-i18n="step2Title"></h2>
          <p data-i18n="step2Body"></p>
        </li>
        <li>
          <h2 data-i18n="step3Title"></h2>
          <p data-i18n="step3Body"></p>
        </li>
        <li>
          <h2 data-i18n="step4Title"></h2>
          <p data-i18n="step4Body"></p>
        </li>
      </ol>

      <section class="warnings">
        <h2 data-i18n="warningsTitle"></h2>
        <div class="warning">
          <h3 data-i18n="warnAccountsTitle"></h3>
          <p data-i18n="warnAccountsBody"></p>
        </div>
        <div class="warning">
          <h3 data-i18n="warnOwnerTitle"></h3>
          <p data-i18n="warnOwnerBody"></p>
        </div>
      </section>

      <section class="pin">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4.75 6H7v-.5a2.5 2.5 0 0 1 5 0V6h2.25A1.25 1.25 0 0 1 15.5 7.25V9.5h.5a2.5 2.5 0 0 1 0 5h-.5v2.25A1.25 1.25 0 0 1 14.25 18H4.75A1.25 1.25 0 0 1 3.5 16.75V7.25A1.25 1.25 0 0 1 4.75 6Z"
            fill="currentColor"
          />
        </svg>
        <div>
          <strong data-i18n="pinTitle"></strong>
          <p data-i18n="pinBody"></p>
        </div>
      </section>

      <section class="privacy">
        <h2 data-i18n="privacyTitle"></h2>
        <p data-i18n="privacyBody"></p>
      </section>
    </main>

    <script src="i18n.js"></script>
  </body>
</html>
