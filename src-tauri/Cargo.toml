[package]
name = "universal-downloader"
version = "1.0.0"
description = "Fast, private and ad-free media downloading."
authors = ["Universal Downloader"]
edition = "2021"
rust-version = "1.82"
default-run = "universal-downloader"

[lib]
name = "universal_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The browser link's native messaging host. A separate program rather than the
# app re-entered with an argument: Chrome starts it, speaks to it over stdin and
# stdout and kills it, none of which a windowed Tauri process is shaped for, and
# keeping it separate means argument parsing for a browser-controlled command
# line never happens inside the process that owns the database.
[[bin]]
name = "ud-bridge"
path = "src/bin/ud-bridge.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "json", "socks"] }
futures-util = "0.3"
bytes = "1"

rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
zip = { version = "6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
urlencoding = "2"
once_cell = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# The browser link: registry values under the user's own hive tell each browser
# where the native messaging host is, and DPAPI keeps the stored session inert
# in any copy of the file that leaves this Windows account.
winreg = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
